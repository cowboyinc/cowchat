[workspace]
members = [
    "crates/cowchat-server",
    "crates/cowchat-cli",
    "crates/cowchat-codex",
]
resolver = "2"

[workspace.package]
version = "0.9.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cowboyinc/cowchat"

[workspace.dependencies]
cowchat-server = { path = "crates/cowchat-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"

# Git dependency patches do not propagate from CBSS. Keep its complete
# protocol-compatible commonware family unified in this executable workspace.
[workspace.dependencies.cowchat-client]
git = "https://github.com/cowboyinc/cowchat-core.git"
rev = "e440e97167bb0a8874a98197568dcd4e8e229537"


[workspace.dependencies.cowchat-core]
git = "https://github.com/cowboyinc/cowchat-core.git"
rev = "e440e97167bb0a8874a98197568dcd4e8e229537"
