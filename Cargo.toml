[workspace]
members = [
    "crates/cowchat-server",
    "crates/cowchat-cli",
    "crates/cowchat-codex",
]
resolver = "2"

[workspace.package]
version = "0.9.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cowboyinc/cowchat"

[workspace.dependencies]
cowchat-core = { git = "https://github.com/cowboyinc/cowboy-protocol.git", rev = "3e115e23b9fc69e448343133879baf517c3d2ec6" }
cowchat-server = { path = "crates/cowchat-server" }
cowchat-client = { git = "https://github.com/cowboyinc/cowboy-protocol.git", rev = "3e115e23b9fc69e448343133879baf517c3d2ec6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"

# Git dependency patches do not propagate from CBSS. Keep its complete
# protocol-compatible commonware family unified in this executable workspace.
[patch.crates-io]
commonware-codec = { git = "https://github.com/cowboyinc/commonware-monorepo", rev = "2e9f61fb846eff3c5bc01c65f933bab097f63aba" }
commonware-cryptography = { git = "https://github.com/cowboyinc/commonware-monorepo", rev = "2e9f61fb846eff3c5bc01c65f933bab097f63aba" }
commonware-formatting = { git = "https://github.com/cowboyinc/commonware-monorepo", rev = "2e9f61fb846eff3c5bc01c65f933bab097f63aba" }
commonware-macros = { git = "https://github.com/cowboyinc/commonware-monorepo", rev = "2e9f61fb846eff3c5bc01c65f933bab097f63aba" }
commonware-macros-impl = { git = "https://github.com/cowboyinc/commonware-monorepo", rev = "2e9f61fb846eff3c5bc01c65f933bab097f63aba" }
commonware-math = { git = "https://github.com/cowboyinc/commonware-monorepo", rev = "2e9f61fb846eff3c5bc01c65f933bab097f63aba" }
commonware-parallel = { git = "https://github.com/cowboyinc/commonware-monorepo", rev = "2e9f61fb846eff3c5bc01c65f933bab097f63aba" }
commonware-utils = { git = "https://github.com/cowboyinc/commonware-monorepo", rev = "2e9f61fb846eff3c5bc01c65f933bab097f63aba" }
