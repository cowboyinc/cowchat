[package]
name = "cowchat-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cowchat server daemon"

[features]
# Hosted owner-stream transport. Local clients do not need the chain SDK.
cbqs = ["dep:cbqs-client", "dep:cowboy-protocol-codec", "dep:commonware-codec", "dep:ed25519-dalek"]
# In-process real broker used only by the integration tests.
cbqs-test = ["cbqs", "dep:cbqsd"]
# Durable checkpoint-batch publication through the existing CBFS SDK.
cbfs-archive = ["cbqs", "dep:cbfs-sdk", "dep:cbfs-hooks", "dep:cbfs-types"]
# Opt-in subprocess tests require COWCHAT_TEST_CBFS_NODE built at the SDK pin.
cbfs-archive-test = ["cbfs-archive", "cbqs-test", "cbfs-sdk/test-support", "dep:cbfs-transport", "dep:sled", "dep:async-trait"]
# Explicit, ignored River probe; reuses production CBFS CLI auth/provisioning.
river-perf = ["cbfs-archive-test", "hosted-bootstrap"]
# Production entrypoint; contains no broker or storage fixture.
hosted-bootstrap = ["cbfs-archive", "dep:cbfs-cli", "dep:cbfs-registry-proto", "dep:anyhow", "dep:hex", "dep:zeroize"]

[[bin]]
name = "cowchat-server"
path = "src/main.rs"

[lib]
name = "cowchat_server"
path = "src/lib.rs"

[dependencies]
cowchat-core.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
log.workspace = true
env_logger.workspace = true
dashmap = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
directories = "5"
rand = "0.8"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
rust-embed = "8"
mime_guess = "2"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
fs2 = "0.4"
libc = "0.2"
cbqs-client = { git = "https://github.com/cowboyinc/cbqs.git", rev = "7f0fb216bfa2dc53d618224aecf3c7cb628a3015", optional = true }
cbqsd = { git = "https://github.com/cowboyinc/cbqs.git", rev = "7f0fb216bfa2dc53d618224aecf3c7cb628a3015", features = ["test-legacy-snapshots"], optional = true }
cowboy-protocol-codec = { git = "https://github.com/cowboyinc/cowboy-protocol.git", rev = "1ea94534a84d743e90c7f067758063790ca1e75a", features = ["cbqs-signing", "serde", "signing"], optional = true }
commonware-codec = { git = "https://github.com/cowboyinc/commonware-monorepo", rev = "2e9f61fb846eff3c5bc01c65f933bab097f63aba", optional = true }
ed25519-dalek = { version = "2.2", optional = true }
cbfs-sdk = { git = "https://github.com/cowboyinc/cbfs.git", rev = "d8ddaad0dee6a0b8b57bd7308376208446ced012", optional = true }
cbfs-hooks = { git = "https://github.com/cowboyinc/cbfs.git", rev = "d8ddaad0dee6a0b8b57bd7308376208446ced012", optional = true }
cbfs-types = { git = "https://github.com/cowboyinc/cbfs.git", rev = "d8ddaad0dee6a0b8b57bd7308376208446ced012", optional = true }
cbfs-transport = { git = "https://github.com/cowboyinc/cbfs.git", rev = "d8ddaad0dee6a0b8b57bd7308376208446ced012", optional = true }
sled = { version = "0.34", optional = true }
async-trait = { version = "0.1", optional = true }
cbfs-cli = { git = "https://github.com/cowboyinc/cbfs.git", rev = "d8ddaad0dee6a0b8b57bd7308376208446ced012", optional = true }
cbfs-registry-proto = { git = "https://github.com/cowboyinc/cbfs.git", rev = "d8ddaad0dee6a0b8b57bd7308376208446ced012", optional = true }
anyhow = { version = "1", optional = true }
hex = { version = "0.4", optional = true }
zeroize = { version = "1", optional = true }

[dev-dependencies]
cowchat-client.workspace = true
tempfile = "3"
tokio-tungstenite = "0.26"
