[package]
name = "cowchat-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cowchat server daemon"

[[bin]]
name = "cowchat-server"
path = "src/main.rs"

[lib]
name = "cowchat_server"
path = "src/lib.rs"

[dependencies]
cowchat-core.workspace = true
cowchat-crypto = { path = "../cowchat-crypto" }
cowboy-protocol-codec = { git = "https://github.com/cowboyinc/cowboy-protocol.git", rev = "0d5e8b69ced97bd3cd45314c17a3ae9dd854e1e8" }
cowboy-protocol-light-client = { git = "https://github.com/cowboyinc/cowboy-protocol.git", rev = "0d5e8b69ced97bd3cd45314c17a3ae9dd854e1e8" }
ciborium = "0.2"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
log.workspace = true
env_logger.workspace = true
dashmap = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
directories = "5"
rand = "0.8"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
rust-embed = "8"
mime_guess = "2"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
fs2 = "0.4"
libc = "0.2"

[dev-dependencies]
ed25519-dalek = "2"
cowboy-protocol-light-client = { git = "https://github.com/cowboyinc/cowboy-protocol.git", rev = "0d5e8b69ced97bd3cd45314c17a3ae9dd854e1e8", features = ["test-fixtures"] }
commonware-codec = { git = "https://github.com/cowboyinc/commonware-monorepo", rev = "2e9f61fb846eff3c5bc01c65f933bab097f63aba" }
commonware-consensus = { git = "https://github.com/cowboyinc/commonware-monorepo", rev = "2e9f61fb846eff3c5bc01c65f933bab097f63aba", features = ["mocks"] }
commonware-cryptography = { git = "https://github.com/cowboyinc/commonware-monorepo", rev = "2e9f61fb846eff3c5bc01c65f933bab097f63aba", features = ["mocks"] }
commonware-parallel = { git = "https://github.com/cowboyinc/commonware-monorepo", rev = "2e9f61fb846eff3c5bc01c65f933bab097f63aba", default-features = false }
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
hex = "0.4"
cowchat-client.workspace = true
tempfile = "3"
tokio-tungstenite = "0.26"
