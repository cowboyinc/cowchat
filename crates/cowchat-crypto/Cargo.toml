[package]
name = "cowchat-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cowchat v3 deterministic encoding and cryptographic primitives"

[dependencies]
base64.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
sha2.workspace = true
ciborium = "0.2"
ed25519-dalek = { version = "2", features = ["zeroize"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
hpke = { version = "0.13", features = ["x25519"] }
zeroize = "1"
rand = "0.9"
hex = "0.4"

[dev-dependencies]
serde_json.workspace = true
