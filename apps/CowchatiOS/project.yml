name: CowchatiOS
options:
  bundleIdPrefix: inc.cowboy
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Cowboy Labs, Inc. Every build signs with the company's team, so capabilities such as push are set up once.
    DEVELOPMENT_TEAM: RG258YXC34
    CODE_SIGN_STYLE: Automatic
packages:
  CowchatKit:
    path: ../CowchatKit
targets:
  CowchatiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: CowchatKit
    info:
      path: Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers: [inc.cowboy.cowchat.ios.refresh]
        UIBackgroundModes: [fetch]
        CFBundleURLTypes:
          - CFBundleURLName: inc.cowboy.cowchat.ios
            CFBundleURLSchemes: [cowchat]
    settings:
      configs:
        # Test builds are their own app, "Cowchat Dev", so one can sit beside a TestFlight build on a device.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: inc.cowboy.cowchat.ios.dev
          INFOPLIST_KEY_CFBundleDisplayName: Cowchat Dev
      base:
        PRODUCT_BUNDLE_IDENTIFIER: inc.cowboy.cowchat.ios
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Cowchat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Cowchat connects to a Cowchat server on your network.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
  CowchatiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: CowchatiOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: inc.cowboy.cowchat.ios.tests
  CowchatiOSLiveTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LiveTests
    dependencies:
      - target: CowchatiOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: inc.cowboy.cowchat.ios.livetests
schemes:
  CowchatiOS:
    build:
      targets:
        CowchatiOS: all
        CowchatiOSTests: [test]
    test:
      targets: [CowchatiOSTests]
  CowchatiOSLive:
    build:
      targets:
        CowchatiOS: all
        CowchatiOSLiveTests: [test]
    test:
      targets: [CowchatiOSLiveTests]
