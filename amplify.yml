version: 1
applications:
  - appRoot: site
    frontend:
      phases:
        preBuild:
          commands:
            # Any pnpm 12 switches itself to the exact version site/package.json
            # pins in packageManager, so only the major is named here.
            - npm install --global --no-fund --no-audit pnpm@12
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm run build
      artifacts:
        baseDirectory: out
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
