name: Windows Rust

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  server-cli:
    name: Server and CLI
    permissions:
      contents: read
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - name: Check server and CLI
        run: cargo check --locked -p cowchat-server -p cowchat-cli
      - name: Test server
        run: cargo test --locked -p cowchat-server
      - name: Test CLI
        run: cargo test --locked -p cowchat-cli
