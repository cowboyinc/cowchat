name: Public build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy
      - name: Resolve without private credentials
        env:
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_TERMINAL_PROMPT: '0'
        run: |
          export CARGO_HOME="$RUNNER_TEMP/public-cargo"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/metadata.json"
          python3 - "$RUNNER_TEMP/metadata.json" <<'PY'
          import json,sys
          packages=json.load(open(sys.argv[1]))['packages']
          for p in packages:
              source=p['source'] or ''
              assert not source.startswith('git+') or source.startswith('git+https://github.com/cowboyinc/cowchat-core.git?rev=d425a065d140889e2eae4a60c8cbd6ab0863fcb4#'), source
          PY
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --all-targets --all-features
      - run: cargo build --locked --release -p cowchat-server -p cowchat-cli -p cowchat-codex
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.1.2
      - run: pnpm --dir tools/cowchat-charts install --frozen-lockfile
        env:
          OPENUI_TELEMETRY_DISABLED: '1'
          DO_NOT_TRACK: '1'
      - run: node tools/cowchat-charts/bundle-mac.mjs
      - if: runner.os == 'macOS'
        working-directory: apps/CowchatMac
        run: swift test && swift build -c release
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/cowchat-charts
    env:
      OPENUI_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.1.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps --only-shell
      - run: pnpm test
