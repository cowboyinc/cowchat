name: Public build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy
      - name: Resolve without private credentials
        env:
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_TERMINAL_PROMPT: '0'
        run: |
          export CARGO_HOME="$RUNNER_TEMP/public-cargo"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/metadata.json"
          python3 - "$RUNNER_TEMP/metadata.json" <<'PY'
          import json,sys
          packages=json.load(open(sys.argv[1]))['packages']
          for p in packages:
              source=p['source'] or ''
              assert not source.startswith('git+') or source.startswith('git+https://github.com/cowboyinc/cowchat-core.git?rev=e440e97167bb0a8874a98197568dcd4e8e229537#'), source
          PY
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --all-targets --all-features
      - run: cargo build --locked --release -p cowchat-server -p cowchat-cli -p cowchat-codex
      - if: runner.os == 'macOS'
        working-directory: apps/CowchatMac
        run: swift test && swift build -c release
