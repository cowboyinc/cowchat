name: Release

# Build prebuilt cowchat + cowchat-server binaries for four targets, package a
# signed and notarized universal Cowchat macOS app, create a prerelease, and
# open an idempotent formula PR against cowboyinc/homebrew-tap.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and release, e.g. v0.4.0"
        required: true

jobs:
  build:
    name: build (${{ matrix.target }})
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-14
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build release binaries and third-party notices
        run: |
          set -euo pipefail
          cargo build --release --locked --target "${{ matrix.target }}" \
            -p cowchat-cli -p cowchat-server
          cargo install cargo-about --locked --features cli
          cargo about generate --locked --target "${{ matrix.target }}" \
            about.hbs > THIRD-PARTY-NOTICES.md
      - name: Package tarball
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "refusing suspicious tag: $TAG" >&2
            exit 1
          }
          tar -czf "cowchat-${TAG}-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" cowchat cowchat-server \
            -C "$GITHUB_WORKSPACE" LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cowchat-${{ matrix.target }}
          path: cowchat-*.tar.gz
          if-no-files-found: error

  mac-app:
    name: build signed macOS app
    permissions:
      contents: read
    runs-on: macos-26
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Require Apple release credentials
        run: |
          set -euo pipefail
          test -n "$MACOS_CERT_P12" || { echo "Missing MACOS_CERT_P12" >&2; exit 1; }
          test -n "$MACOS_CERT_P12_PASSWORD" || { echo "Missing MACOS_CERT_P12_PASSWORD" >&2; exit 1; }
          test -n "$APPLE_API_KEY" || { echo "Missing APPLE_API_KEY" >&2; exit 1; }
          test -n "$APPLE_API_KEY_ID" || { echo "Missing APPLE_API_KEY_ID" >&2; exit 1; }
          test -n "$APPLE_API_ISSUER" || { echo "Missing APPLE_API_ISSUER" >&2; exit 1; }
      - name: Validate release version and packaging contracts
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "refusing suspicious tag: $TAG" >&2
            exit 1
          }
          VERSION="${TAG#v}"
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            apps/CowchatMac/AppBundle/Info.plist)
          CARGO_VERSION=$(awk '
            $0 == "[workspace.package]" { in_package = 1; next }
            in_package && /^\[/ { exit }
            in_package && /^[[:space:]]*version[[:space:]]*=/ {
              value = $0
              sub(/^[^=]*=[[:space:]]*/, "", value)
              gsub(/[[:space:]\"]/, "", value)
              print value
              exit
            }
          ' Cargo.toml)
          test "$VERSION" = "$APP_VERSION" || {
            echo "tag/app version mismatch: tag=$VERSION app=$APP_VERSION" >&2
            exit 1
          }
          test "$VERSION" = "$CARGO_VERSION" || {
            echo "tag/Cargo version mismatch: tag=$VERSION cargo=$CARGO_VERSION" >&2
            exit 1
          }
          sh apps/CowchatMac/test-dmg-packaging.sh
      - name: Import Developer ID certificate
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/cowchat-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk '/Developer ID Application/ { print $2; exit }')
          test -n "$IDENTITY"
          echo "COWCHAT_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Build and verify universal Cowchat.app
        working-directory: apps/CowchatMac
        run: |
          set -euo pipefail
          ./build-app.sh
          APP="$HOME/Applications/Cowchat.app"
          codesign --verify --deep --strict "$APP"
          lipo "$APP/Contents/MacOS/Cowchat" -verify_arch arm64 x86_64
          lipo "$APP/Contents/Helpers/cowchat-server" -verify_arch arm64 x86_64
          codesign -dv --verbose=4 "$APP" 2>&1 \
            | grep -F 'Authority=Developer ID Application:'
          codesign -dv --verbose=4 "$APP/Contents/Helpers/cowchat-server" 2>&1 \
            | grep -F 'Authority=Developer ID Application:'
      - name: Package signed DMG
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          STAGE=$(mktemp -d "$RUNNER_TEMP/cowchat-dmg-stage.XXXXXX")
          trap 'rm -rf "$STAGE"' EXIT
          ditto "$HOME/Applications/Cowchat.app" "$STAGE/Cowchat.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -quiet -volname Cowchat -srcfolder "$STAGE" \
            -ov -format UDZO "Cowchat-$VERSION.dmg"
          codesign --force --timestamp --sign "$COWCHAT_CODESIGN_IDENTITY" \
            "Cowchat-$VERSION.dmg"
          codesign --verify --verbose=2 "Cowchat-$VERSION.dmg"
          hdiutil verify "Cowchat-$VERSION.dmg" >/dev/null
      - name: Notarize, staple, and assess DMG
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          DMG="Cowchat-$VERSION.dmg"
          KEY="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$KEY"' EXIT
          printf '%s' "$APPLE_API_KEY" > "$KEY"
          xcrun notarytool submit "$DMG" --wait \
            --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature \
            --verbose=4 "$DMG"
          hdiutil verify "$DMG" >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Cowchat-dmg
          path: Cowchat-*.dmg
          if-no-files-found: error

  release:
    needs: [build, mac-app]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish prerelease and render Homebrew formula
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "refusing suspicious tag: $TAG" >&2
            exit 1
          }
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          NOTES='Signed and notarized universal Cowchat.app DMG, plus prebuilt cowchat + cowchat-server binaries (macOS arm64/x86_64, Linux arm64/x86_64). Homebrew install: pending formula merge — this note is updated on promotion.'

          sha() {
            shasum -a 256 "dist/cowchat-${TAG}-$1.tar.gz" | awk '{print $1}'
          }
          MAC_ARM=$(sha aarch64-apple-darwin)
          MAC_X86=$(sha x86_64-apple-darwin)
          LIN_ARM=$(sha aarch64-unknown-linux-gnu)
          LIN_X86=$(sha x86_64-unknown-linux-gnu)

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/cowchat-*.tar.gz dist/Cowchat-*.dmg \
              --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --prerelease \
              --title "Cowchat $TAG" --notes "$NOTES"
          else
            gh release create "$TAG" dist/cowchat-*.tar.gz dist/Cowchat-*.dmg --repo "$REPO" \
              --prerelease --title "Cowchat $TAG" --notes "$NOTES"
          fi

          sed \
            -e "s|@TAG@|${TAG}|g" \
            -e "s|@BASE@|${BASE}|g" \
            -e "s|@MAC_ARM@|${MAC_ARM}|g" \
            -e "s|@MAC_X86@|${MAC_X86}|g" \
            -e "s|@LIN_ARM@|${LIN_ARM}|g" \
            -e "s|@LIN_X86@|${LIN_X86}|g" \
            .github/cowchat-formula.rb.tmpl > /tmp/cowchat.rb
      - name: Open formula PR against cowboyinc/homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.TAP_PR_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "refusing suspicious tag: $TAG" >&2
            exit 1
          }
          git clone "https://x-access-token:${GH_TOKEN}@github.com/cowboyinc/homebrew-tap.git" tap
          cd tap
          if git show origin/main:Formula/cowchat.rb 2>/dev/null | cmp -s - /tmp/cowchat.rb; then
            echo "rendered formula already on main; nothing to do"
            exit 0
          fi
          if git ls-remote --exit-code origin "refs/heads/cowchat-${TAG}" >/dev/null 2>&1; then
            git checkout -b "cowchat-${TAG}" "origin/cowchat-${TAG}"
            if [ -f Formula/cowchat.rb ] && ! cmp -s /tmp/cowchat.rb Formula/cowchat.rb; then
              echo "Formula/cowchat.rb on the existing cowchat-${TAG} branch differs from the render — human edits present; resolve manually" >&2
              exit 1
            fi
          else
            git checkout -b "cowchat-${TAG}"
          fi
          mkdir -p Formula
          cp /tmp/cowchat.rb Formula/cowchat.rb
          git -c user.name=cowchat-release -c user.email=noreply@cowboy.inc add Formula/cowchat.rb
          if ! git diff --cached --quiet; then
            git -c user.name=cowchat-release -c user.email=noreply@cowboy.inc \
              commit -m "cowchat ${TAG}"
            git push origin "cowchat-${TAG}"
          fi
          gh pr create --repo cowboyinc/homebrew-tap \
            --head "cowchat-${TAG}" --base main \
            --title "cowchat ${TAG}" \
            --body "Automated formula bump from the cowchat release workflow." || true
          OPEN=$(gh pr list --repo cowboyinc/homebrew-tap \
            --head "cowchat-${TAG}" --state open --json number --jq 'length')
          [ "$OPEN" -ge 1 ] || {
            echo "no open formula PR for cowchat-${TAG}" >&2
            exit 1
          }
